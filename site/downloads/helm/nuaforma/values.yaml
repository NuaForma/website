image:
  repository: ghcr.io/nuaforma/nuaforma
  tag: 0.3.0-alpha.5
  digest: sha256:8d91b0299ea2f139b56111d60f678e471d7fec35dbf82f5741d94ab0fb729ab3
fonts:
  existingClaim: ""
extensions:
  existingClaim: ""
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
