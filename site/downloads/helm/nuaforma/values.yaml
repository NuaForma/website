image:
  repository: ghcr.io/nuaforma/nuaforma
  tag: 0.4.0-alpha.6
  digest: sha256:af1c2850b8ef67d5777a01dd42fbd031018f5ba0f0a682731ae96a8c579904dc
fonts:
  existingClaim: ""
extensions:
  existingClaim: ""
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
