image:
  repository: ghcr.io/nuaforma/nuaforma
  tag: 0.4.0-alpha.3
  digest: sha256:e939c3f359349c2bfbc1d857e966896944e21e3ea6abffd1ba5a7d536354fa26
fonts:
  existingClaim: ""
extensions:
  existingClaim: ""
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
