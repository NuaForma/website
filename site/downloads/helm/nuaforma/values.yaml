image:
  repository: ghcr.io/nuaforma/nuaforma
  tag: 0.3.0-alpha.3
  digest: sha256:b3298439d88c6c6387336b85fa884119d757e89c412d8b428297881c35a5db14
fonts:
  existingClaim: ""
extensions:
  existingClaim: ""
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
