image:
  repository: ghcr.io/nuaforma/nuaforma
  tag: 0.2.0-alpha.2
  digest: sha256:d1fc94ec091f53d3e02cfc74ce7b94e2faeeeb4cb6c725aa74d267a01d7bf2a5
seccomp:
  localhostProfile: nuaforma/seccomp.json
fonts:
  existingClaim: ""
extensions:
  existingClaim: ""
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
